name: Hola mundo

on:
  push:
  workflow_dispatch:
    inputs:
      saludo:
        description: 'Mensaje de saludo'
        type: string
        default: 'Hola buenos días'

jobs:
  saludar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "hola ${{ github.actor }}, commit ${{ github.sha }}"
      - run: echo "elegiste: ${{ inputs.saludo }}"
