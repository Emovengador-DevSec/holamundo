name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        run: |
          npx --yes firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project hola-mundo-67c1c
