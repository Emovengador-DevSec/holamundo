name: Deploy a Firebase

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Desplegar en Firebase Hosting
        run: |
          npx --yes firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project hola-mundo-67c1c
