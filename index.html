<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecOps Sentinel // Hola Mundo v2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
    body { background: #090B21; color: #4BC0FF; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: rgba(255, 255, 255, 0.04); border: 1px solid #4B3BFF; border-radius: 12px; padding: 25px; max-width: 550px; width: 100%; box-shadow: 0 0 25px rgba(75, 59, 255, 0.35); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(75, 59, 255, 0.4); padding-bottom: 10px; }
    h1 { color: #fff; font-size: 1.3rem; }
    .badge { background: #FF6A1F; color: #fff; font-size: 10px; font-weight: bold; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .stat-box { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(75, 192, 255, 0.2); padding: 10px; border-radius: 6px; }
    .stat-label { font-size: 11px; color: #d0d2ff; }
    .stat-value { font-size: 14px; font-weight: bold; color: #39ff14; margin-top: 4px; }
    .terminal { background: #000; border-left: 3px solid #39ff14; padding: 12px; font-size: 12px; color: #39ff14; border-radius: 4px; min-height: 90px; max-height: 140px; overflow-y: auto; margin-bottom: 15px; }
    .btn-action { background: linear-gradient(45deg, #4B3BFF, #C23BE6); border: none; color: #fff; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
    .btn-action:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>HOLA MUNDO // V2.0</h1>
      <span class="badge">PROD READY</span>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">PLATAFORMA</div>
        <div class="stat-value">FIREBASE CDN</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">ENLACE CI/CD</div>
        <div class="stat-value">ACTIONS PASS ✔</div>
      </div>
    </div>

    <div class="terminal" id="termOutput">
      > Inicializando runtime...<br>
      > Conectado a edge global.<br>
      > Sistema listo para pruebas pasivas.
    </div>

    <button class="btn-action" onclick="runDiagnostic()">Ejecutar Diagnostico de Red</button>
  </div>

  <script>
    function runDiagnostic() {
      const output = document.getElementById('termOutput');
      const time = new Date().toLocaleTimeString();
      const pingMs = Math.floor(Math.random() * (45 - 15 + 1)) + 15;
      
      output.innerHTML += `<br>> [${time}] Check de red local completado.`;
      output.innerHTML += `<br>> Latencia estimada: ${pingMs} ms (HTTP/2 TLS 1.3).`;
      output.scrollTop = output.scrollHeight;
    }
  </script>
</body>
</html>
